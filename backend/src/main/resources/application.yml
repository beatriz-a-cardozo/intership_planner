# Configuração base (produção). Valores sensíveis vêm SEMPRE de variáveis de ambiente.
# Perfil "dev" (application-dev.yml) traz padrões convenientes para rodar localmente.

spring:
  application:
    name: interchange-planner
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/interchange_planner}
    username: ${DB_USERNAME:interchange}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  # Atrás do nginx/proxy: respeita X-Forwarded-* (esquema https, IP do cliente)
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${app.name}
    version: "@project.version@"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

logging:
  structured:
    format:
      # JSON (ECS) em produção; inclui o traceId do MDC. O perfil dev volta ao formato legível.
      console: ecs

app:
  name: ${APP_NAME:Interchange Planner}
  security:
    jwt:
      # Obrigatório. Gere com: openssl rand -base64 48
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:interchange-planner}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token:
      ttl: ${REFRESH_TOKEN_TTL:30d}
      cookie-name: ip_refresh
      cookie-path: /api/auth
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
      cookie-same-site: Strict
    login:
      max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
      lock-duration: ${LOGIN_LOCK_DURATION:15m}
  cors:
    # Lista separada por vírgula. Vazio = só o mesmo domínio (recomendado com o proxy do nginx/Vite).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  jobs:
    enabled: ${APP_JOBS_ENABLED:true}
