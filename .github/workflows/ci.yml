name: CI

on:
  push:
    branches: [main]
  pull_request:
  # reutilizado pelo deploy.yml (o deploy só acontece com o CI verde)
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (mvn verify + Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unitários (surefire) + integração com PostgreSQL real (failsafe/Testcontainers).
      # O OpenApiSpecIT regrava backend/openapi/openapi.json.
      - run: ./mvnw -B verify
      - name: Contrato OpenAPI versionado está atualizado
        run: git diff --exit-code -- openapi/openapi.json || (echo "::error::openapi.json desatualizado. Rode ./mvnw verify e versione o arquivo." && exit 1)
      - uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: backend/openapi/openapi.json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: openapi
          path: backend/openapi
      - name: Tipos TS gerados do OpenAPI estão atualizados
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || (echo "::error::schema.d.ts desatualizado. Rode npm run gen:api e versione o arquivo." && exit 1)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright + axe) na imagem de deploy
    runs-on: ubuntu-latest
    # sem limite, um passo travado (ex.: apt do --with-deps) segura o job por até 6 h
    timeout-minutes: 30
    needs: frontend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: interchange_planner
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U e2e" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      # a mesma imagem que vai para o Render (deploy/Dockerfile), não um ambiente de desenvolvimento
      - name: Build da imagem única
        run: docker build -f deploy/Dockerfile -t interchange-planner:e2e .
      - name: Sobe a aplicação
        run: |
          docker run -d --name app --network host -m 512m \
            -e DB_URL=jdbc:postgresql://localhost:5432/interchange_planner -e DB_USERNAME=e2e -e DB_PASSWORD=e2e \
            -e JWT_SECRET="$(openssl rand -hex 32)" interchange-planner:e2e
          for i in $(seq 1 60); do
            curl -fsS localhost:8080/actuator/health/readiness | grep -q UP && exit 0
            sleep 3
          done
          docker logs app; exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
        timeout-minutes: 10
      - run: npm run e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
