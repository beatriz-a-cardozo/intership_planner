name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (mvn verify + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unitários (surefire) + integração com PostgreSQL real (failsafe/Testcontainers).
      # O OpenApiSpecIT regrava backend/openapi/openapi.json.
      - run: ./mvnw -B verify
      - name: Contrato OpenAPI versionado está atualizado
        run: git diff --exit-code -- openapi/openapi.json || (echo "::error::openapi.json desatualizado. Rode ./mvnw verify e versione o arquivo." && exit 1)
      - uses: actions/upload-artifact@v5
        with:
          name: openapi
          path: backend/openapi/openapi.json
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: openapi
          path: backend/openapi
      - name: Tipos TS gerados do OpenAPI estão atualizados
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || (echo "::error::schema.d.ts desatualizado. Rode npm run gen:api e versione o arquivo." && exit 1)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
