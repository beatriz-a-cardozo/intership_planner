# Ambiente completo local: PostgreSQL + API + frontend (nginx).
#   cp .env.example .env   # e preencha JWT_SECRET
#   docker compose up --build
# App: http://localhost:8081  ·  Swagger: http://localhost:8080/swagger-ui.html

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-interchange_planner}
      POSTGRES_USER: ${DB_USERNAME:-interchange}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-interchange_planner}
      DB_USERNAME: ${DB_USERNAME:-interchange}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      APP_NAME: ${APP_NAME:-Interchange Planner}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_NAME: ${APP_NAME:-Interchange Planner}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  pgdata:
